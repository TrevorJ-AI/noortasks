name: Android Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36 components
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web bundle and sync Capacitor Android project
        run: |
          pnpm --filter @noortasks/quickadd build
          pnpm --filter @noortasks/web build
          pnpm --filter @noortasks/android cap:sync

      - name: Build Android debug APK
        working-directory: apps/android/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --max-workers=1 -Dorg.gradle.jvmargs=-Xmx1200m

      - name: Prepare release artifact and checksum
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          mkdir -p dist-apk
          cp apps/android/android/app/build/outputs/apk/debug/app-debug.apk "dist-apk/noortasks-${TAG}-debug.apk"
          (cd dist-apk && sha256sum "noortasks-${TAG}-debug.apk" > "noortasks-${TAG}-debug.apk.sha256")

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: noortasks-android-debug-apk
          path: dist-apk/*

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-apk/*.apk
            dist-apk/*.sha256
